{% extends "base.html" %}

{% block title %}
Add Project | SkillForge
{% endblock %}

{% block content %}

<div class="project-form">

    <h1>Add Project</h1>

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>Project Name</label>
            <input
                type="text"
                name="name"
                required
            >
        </div>

        <div>
            <label>Description</label>
            <textarea
                name="description"
                rows="5"
                required
            ></textarea>
        </div>

        <div>
            <label>Project Type</label>

            <select name="project_type">

                <option value="academic">
                    Academic
                </option>

                <option value="personal">
                    Personal
                </option>

                <option value="team">
                    Team
                </option>

                <option value="hackathon">
                    Hackathon
                </option>

                <option value="freelance">
                    Freelance
                </option>

            </select>

        </div>

        <div>
            <label>Technologies</label>

            <input
                type="text"
                name="technologies"
                placeholder="React, Django, PostgreSQL"
                required
            >
        </div>

        <div>
            <label>Start Date</label>

            <input
                type="date"
                name="start_date"
            >
        </div>

        <div>
            <label>End Date</label>

            <input
                type="date"
                name="end_date"
            >
        </div>

        <div>
            <label>Your Role</label>

            <input
                type="text"
                name="role"
                placeholder="Frontend Developer"
            >
        </div>

        <div>
            <label>Team Members</label>

            <textarea
                name="team_members"
                rows="3"
                placeholder="John, Alex, Sarah"
            ></textarea>
        </div>

        <div>
            <label>GitHub URL</label>

            <input
                type="url"
                name="github_url"
                placeholder="https://github.com/..."
            >
        </div>

        <div>
            <label>Live Demo URL</label>

            <input
                type="url"
                name="live_demo_url"
                placeholder="https://..."
            >
        </div>

        <button type="submit">
            Save Project
        </button>

        <a href="{% url 'students:project_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
